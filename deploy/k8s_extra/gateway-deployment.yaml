apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kv-gateway
  template:
    metadata:
      labels:
        app: kv-gateway
    spec:
      containers:
      - name: gateway
        image: distributed-kv:latest
        imagePullPolicy: IfNotPresent
        command: ["/gateway"]
        env:
        - name: PEERS
          value: "kv-node-0.kv-headless,kv-node-1.kv-headless,kv-node-2.kv-headless"
        ports:
        - containerPort: 8080
          name: grpc-gw
---
apiVersion: v1
kind: Service
metadata:
  name: kv-gateway-svc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: kv-gateway
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
